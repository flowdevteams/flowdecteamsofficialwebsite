<!DOCTYPE html>
<html>
<head>
<style>
body { display: flex; gap: 40px; padding: 40px; background: #e8edf5; }
.logo-container { 
  width: 400px; height: 400px; 
  border: 2px solid #999; 
  display: flex; align-items: center; justify-content: center;
  background: white;
}
.logo-container img { width: 350px; height: 350px; }
h3 { text-align: center; margin-bottom: 10px; }
.col { text-align: center; }
</style>
</head>
<body>
<div class="col">
  <h3>SVG Vector Logo (Current)</h3>
  <div class="logo-container" style="background: linear-gradient(135deg, #e0e8f0, #f0f4fa);">
    <img src="/logo/flowdevteams-vector.svg" alt="SVG">
  </div>
</div>
<div class="col">
  <h3>Original PNG Logo (Reference)</h3>
  <div class="logo-container" style="background: linear-gradient(135deg, #e0e8f0, #f0f4fa);">
    <img src="/logo/flowdevteams-logo.png" alt="PNG">
  </div>
</div>
</body>
</html>
